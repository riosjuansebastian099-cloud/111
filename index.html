<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>111 — Servidor de la Comunidad</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080809;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #8a8a93;
            --accent-green: #00ff87;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 120%, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
        }

        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .brand-header {
            margin-bottom: 2.5rem;
        }

        .logo-wrapper {
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        .server-avatar {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 32px;
            border: 1px solid var(--border-color);
            background: #000;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .server-title {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(180deg, #ffffff 0%, #a3a3a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .server-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .server-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #5865F2;
            border-radius: 50%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 1.5rem 1rem;
            backdrop-filter: blur(12px);
        }

        .stat-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .stat-label.online::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 2s infinite;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .join-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1.25rem;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            border-radius: 20px;
            box-shadow: 0 4px 30px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease;
        }

        .join-btn:hover {
            transform: translateY(-2px);
        }

        .join-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .footer-link {
            display: inline-block;
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="brand-header">
            <div class="logo-wrapper">
                <img src="https://discordapp.com" alt="111 Logo" class="server-avatar">
            </div>
            <h1 class="server-title">111</h1>
            <span class="server-badge">Servidor de comunidad</span>
        </header>

        <main>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label online">En línea</div>
                    <div class="stat-value" id="online-count">22</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Miembros</div>
                    <div class="stat-value" id="member-count">531</div>
                </div>
            </div>

            <a href="https://discord.gg" target="_blank" class="join-btn">
                <svg viewBox="0 0 127.14 96.36">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a74.37,74.37,0,0,0,6.85-11.11,68.43,68.43,0,0,1-10.85-5.22c.91-.66,1.8-1.34,2.65-2a75.58,75.58,0,0,0,73,0c.85.69,1.74,1.37,2.65,2a68.45,68.45,0,0,1-10.85,5.22,74.37,74.37,0,0,0,6.85,11.11,105.73,105.73,0,0,0,31-18.83C129,50.7,122.64,27.78,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/>
                </svg>
                Unirse al Servidor
            </a>
        </main>

        <footer>
            <a href="https://discord.gg" target="_blank" class="footer-link">discord.gg/5dhu</a>
        </footer>
    </div>

    <script>
        const inviteApi = 'https://discord.com';

        async function updateCounts() {
            try {
                const response = await fetch(inviteApi);
                if (!response.ok) throw new Error('API Error');
                const data = await response.json();
                
                if(data.approximate_member_count) {
                    document.getElementById('member-count').innerText = data.approximate_member_count.toLocaleString();
                }
                if(data.approximate_presence_count) {
                    document.getElementById('online-count').innerText = data.approximate_presence_count.toLocaleString();
                }
            } catch (e) {
                console.log("Usando datos base estables.");
            }
        }

        updateCounts();
        setInterval(updateCounts, 15000);
    </script>
</body>
</html>
